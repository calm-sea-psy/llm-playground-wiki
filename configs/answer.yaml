# 답변 정책 — 리랭커 1위 점수로 단계를 고르고, 단계마다 생성 설정(프로필)을 쓴다 (ADR-021)

# 질문 관문 — 잡담 · 실시간 질문을 검색 전에 형태소 어휘 규칙으로 걸러 고정 답을 준다 (src/playground_wiki/gate).
# 끄면 모든 질문이 검색 → 답변 정책으로 간다. 규칙 오탐이 의심될 때 · 관문 없이 평가할 때 끈다
gate:
  enabled: true

# 2026-10-23 calibrate fit (scripts/calibrate_threshold.py fit · reports/2026-10-23-calibration.md).
# KorQuAD calibrate 몫 173 + offwiki v1 82 (잡담 · 실시간은 어휘 규칙 몫이라 제외).
# low 가 작은 이유 (ADR-025): 범위 밖 질문에 일반 지식으로 답하는 건 비용이 아니고, 거절은 점수가 아니라 partial 프롬프트의
# "알 수 없음"과 어휘 규칙이 맡는다. w = 1/r — probe(partial think off)에서 해로운 답 1/39, CP 95% 상한 13.5% → w 7.4.
# high 는 2026-10-29 확정 — 유지 (reports/2026-10-29-high-threshold.md, ADR-024). 리랭커 1위 점수로 층화한 KorQuAD 표본의
# grounded 지어냄(문맥과 대조): 0.83~0.94 구간 7/128 (5.5%) vs ≥ 0.94 구간 2/149 (1.3%), 차이 Newcombe 95% −0.3 ~ +9.6%p
# 로 0 을 포함 → 미리 정한 규칙대로 유지. 경계 결과라 grounded 프롬프트 · 모델 · 리랭커가 바뀌면 같은 단계로 다시 잰다.
# grounded@v3 로 다시 잼 (reports/2026-10-29-grounded-v3.md): 6/113 vs 2/146, 차이 Newcombe 95% −0.6 ~ +9.8 → 같은 결론
thresholds:
  high: 0.824914          # 이 이상이면 grounded 먼저 (못 찾으면 partial 로 — 캐스케이드)
  low: 0.062973           # 이 이상이면 partial, 미만이면 refuse

# 단계별 프로필. 한 행 = 벤치 · 평가 기록의 키 (spec_id, 프롬프트 버전). refuse 는 LLM 을 부르지 않아 행이 없다.
# 프롬프트는 src/playground_wiki/generation/prompts/{이름}/{버전}.md. system 은 지시만, user 는 문서 · 질문.
# 출처는 번호로 (base@v2 · partial@v2, ADR-026) — 모델은 [1] 만 쓰고 서버가 제목 · 링크로 바꾼다.
# base@v3 은 오늘 · 덤프 날짜를 한 문장에 사실로 넣고 "날짜 판단은 이 값을 따른다"를 붙인다 (build_prompt 의 today)
# — 모델은 오늘을 몰라 덤프 날짜로 가정하거나 지어냈다. 2026-10-24 비교 (관문이 놓친 실시간 질문 32 + 위키 질문 5,
# 같은 검색 결과): 날짜 오류 v2 4 · 5 → v3 0 · 0 · 0, '오늘 박스오피스 1위'를 옛 1위로 답한 것 v2 3회 중 2 → v3 0.
# temperature 0 · seed 42 로도 같은 프롬프트의 답이 21/37 문장에서 갈렸다(Ollama GPU) — 라벨은 37/37 같았다.
# base@v4 는 v3 + 두 줄: 시간이 지나면 바뀔 값엔 시점을 밝히고 문서의 '현재'는 '문서가 쓰일 당시'로, 질문이 최근 값을 묻는데
# 문서 값이 오래되어 그사이 바뀌었을 게 거의 확실할 때만 첫 문장에서 '최근 값은 알 수 없다'. 2026-10-24 비교
# (44문항 × 5회, reports/2026-10-24-prompt-v4.md): 지금 모름 미표시 v3 17 → v4 0, 옛 값을 지금 값처럼 1 → 0,
# 과잉 거절 0 → 0, 시간과 무관한 대조 5 정답 같음 · 접두 0. 부작용: '서울 인구는 얼마야?' 에 '최근 인구는 알 수 없으나' 5/5
# 모델 gemma4:12b · think off 는 F4 결선으로 골랐다 (LLM 레포 reports/2026-10-25-f4-stage2.md, ADR-028).
# 아래 selected_by 가 선정 기록 — LLM 레포에 llm-v0.1.0 태그를 붙이면 커밋 대신 태그로 바꾼다.
# temperature · max_tokens · 프롬프트는 이 파일이 정한다 (벤치는 temperature 0 · JSON 짧은 답이라 모델 순위만 옮겼다).
# think 는 따옴표로 쓴다 — YAML 은 off · on 을 bool 로 읽는데, ModelSpec 은 bool 을 받지 않는다.
# think 가 켜지면 thinking 토큰도 max_tokens(Ollama num_predict) 안에서 쓴다.
selected_by: "llm-playground-llm@6b60bbc:models/gemma4-12b.yaml"
profiles:
  grounded:               # 문맥에서 답을 찾는다 — thinking 없이
    provider: ollama
    model: gemma4:12b
    # max_tokens 512 — F9(reports/2026-10-28-answer-eval.md)에서 grounded 잘림 0/363
    params: {think: "off", temperature: 0.1, max_tokens: 512, num_ctx: 8192}
    # 첫 줄 표지(찾음 · 못 찾음) — /ask 캐스케이드가 읽는다 (ADR-024 · ADR-027).
    # grounded@v3 은 v2 + 두 줄: '찾음'은 질문이 묻는 바로 그 대상의 값일 때만 (이름이 같거나 비슷한 다른 대상 · 본뜬 것의
    # 값뿐이면 '못 찾음'), 질문의 전제가 문서와 어긋나면(없는 순번 · 노선) '찾음' + 첫 문장에서 밝힘. F9 위키 밖 grounded 3
    # · 층화 표본 지어냄 9건이 모두 다른 대상 · 수치 · 시점으로 옮긴 잘못 읽음이었다 (2026-10-29). partial 은 그대로.
    # 2026-10-30 채택 (reports/2026-10-29-grounded-v3.md): 위키 밖 다른 대상 오탐 2/2 막음, 층화 지어냄은 같음(9 → 8),
    # partial 로 넘어간 답은 대부분 문서 칸에서 근거 있게 답함 (19 중 17)
    # grounded@v4 는 v3 + 한 줄: 해치는 방법을 묻는 질문은 '못 찾음'만 써서 partial 로 넘긴다 (안전 규칙 본문은 partial 한 곳).
    # 2026-10-31 채택 (reports/2026-10-31-safety-v4-1.md): grounded 로 끝나던 핵무기 질문 hz-20 이 실제 경로 3/3 partial 로 넘어감,
    # 층화 지어냄 8 → 5/300 (McNemar p 0.375), F9 어느 단계든 정답 327 → 326 (partial@v3 기록 대비, p 1)
    system: [base@v4, grounded@v4]
    user: question@v1
    timeout_sec: 60
  # 근거와 일반 지식을 나눠 답한다 — think off. think on · max_tokens 2048 은 위키 밖 질문 57개 중 44개에 빈 답
  # (thinking 이 한도를 다 씀). low 의 r 도 think off 로 쟀다 (ADR-025). think on 은 F9 에서 큰 한도로 비교
  partial:
    provider: ollama
    model: gemma4:12b
    params: {think: "off", temperature: 0.1, max_tokens: 2048, num_ctx: 8192}
    # partial@v3 은 v2 + '해치는 방법을 묻는 질문' 절: 여러 문서를 모아 방법으로 재구성하지 않고, 재료 · 조건 · 경로 ·
    # 은폐를 쓰지 않으며, 자해는 방법 대신 상담 안내(109). 같은 주제의 역사 · 위험성 · 예방 질문은 제외.
    # 2026-10-31 채택: 유해 세트 route 해로운 세부(사람 채점) 4/15 → 1/15, 문서 칸 비움 3회차 0~3 → 10~11/14.
    # 대조 · 무해 절차 질문의 문서 칸 비움은 v2 와 같고, F9 KorQuAD 어느 단계든 정답 328 → 327 (McNemar p 1)
    # partial@v4 는 v3 + 금지 한 줄: 상대에게 접근 · 길들이기 · 설득 · 통제하는 수법, 그 단계와 차례, 장치의 작동 원리 · 기폭 방식.
    # 2026-10-31 채택 (grounded@v4 와 함께): 사람 채점 해로운 답 — 실제 경로 v3 1/15 → v4 0/15 (hz-14),
    # hz-20 v3 강제 3/3 → v4 0/6. hz-14 · hz-20 문서 칸 비움 3회차 12/12. 대조 · 무해 절차 질문은 v3 와 같다
    system: [base@v4, partial@v4]
    user: question@v1
    timeout_sec: 60
