[project]
name = "playground-wiki"
version = "0.1.0"
description = "한국어 위키백과 QA — 덤프 파싱 · 정제, 위키 검색 서비스(/search), 답변 · 에이전트"
readme = "README.md"
authors = [
    { name = "yunpilsoo", email = "305675348+calm-sea-psy@users.noreply.github.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.159.1",
    "kiwipiepy==0.24.1",  # 관문 규칙이 토큰 경계에 기댄다 — 올릴 때는 tests/gate 경계 스냅샷을 같이 본다
    "lxml>=6.1.3",
    "mwparserfromhell>=0.7.2",
    "playground-corpus[parquet,local]",
    "playground-evalkit",
    "playground-llm[ollama]",
    "playground-retrieval[rerank]",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "torch>=2.11.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
# 평가 데이터를 Claude API 로 만드는 스크립트용 (scripts/paraphrase_korquad.py). 제품은 쓰지 않는다 — uv run --group claude
claude = [
    "anthropic>=2.3.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
# kiwipiepy 가 모델 패키지를 버전 조건 없이 끌어온다. 모델 파일이 바뀌면 토큰 경계가 달라져 따로 고정한다
constraint-dependencies = ["kiwipiepy-model==0.24.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
# 모듈은 git 태그로 설치한다. 모듈을 함께 고칠 때는 나란히 clone 하고 잠깐 path(editable)로 바꾼다
playground-corpus = { git = "https://github.com/calm-sea-psy/llm-playground-corpus", tag = "v0.1.0" }
playground-evalkit = { git = "https://github.com/calm-sea-psy/llm-playground-llm", tag = "evalkit-v0.2.0", subdirectory = "packages/evalkit" }
# 첫 태그 llm-v0.1.0 은 Phase 2 완료 때 붙인다. 그때까지 main 커밋(Generation.done_reason, PR #6)으로 고정
playground-llm = { git = "https://github.com/calm-sea-psy/llm-playground-llm", rev = "5e455b5f5ddc13a95074c42a213759a64876931d", subdirectory = "packages/llm" }
playground-retrieval = { git = "https://github.com/calm-sea-psy/llm-playground-retrieval", tag = "v0.1.1" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
