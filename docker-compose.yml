# 프로젝트 이름을 고정한다 — 볼륨 이름(llm-playground-wiki_pg_data · _qdrant_data)이 여기서 나온다.
# 폴더 이름이 달라도(worktree 등) 같은 적재 데이터를 쓰게 한다
#
#   docker compose up -d --wait                       저장소(PostgreSQL · Qdrant)만
#   docker compose --profile api up -d --build --wait 저장소 + wiki API (GPU · 호스트 Ollama 필요)
#
# 호스트 포트는 .env 의 PG_PORT · QDRANT_PORT · QDRANT_GRPC_PORT · API_PORT 로 바꾼다 (다른 컨테이너와 겹칠 때).
name: llm-playground-wiki

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "${QDRANT_PORT:-6333}:6333"  # REST
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # 이미지에 curl 이 없어 bash /dev/tcp 로 /readyz 를 확인한다
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 10

  # wiki API — 위 저장소에 붙어 /search · /health · /ask 를 서빙한다. profile api 일 때만 뜬다.
  # 컬렉션은 미리 적재해 두고(scripts/ingest.py) BM25 색인을 data/index/bm25/{컬렉션} 에 저장해 둔다(scripts/build_bm25.py).
  api:
    profiles: ["api"]
    build: .
    image: llm-playground-wiki-api:local
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      # 위 로컬 Qdrant 를 쓴다 — 컨테이너 안에서는 localhost 가 아니라 compose 네트워크의 qdrant 로 붙는다
      QDRANT_MODE: local
      QDRANT_LOCAL_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      RAG_COLLECTION: ${RAG_COLLECTION:-kowiki-subset-10000_kure-v1}
      RAG_BM25_INDEX_DIR: /app/data/index/bm25
      RAG_LOG_QUESTIONS: ${RAG_LOG_QUESTIONS:-0}
      HF_HOME: /hf  # 임베딩 · 리랭커 모델 캐시 — 호스트 캐시를 붙여 다시 받지 않는다
    volumes:
      - ./data/index/bm25:/app/data/index/bm25:ro
      - ${HF_CACHE_DIR:-~/.cache/huggingface}:/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 에서도 호스트의 Ollama 에 닿게 한다
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s  # 모델 · 색인을 올리는 시간
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
