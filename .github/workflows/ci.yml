# 린트 · 테스트. main push 와 PR 에서 돈다
#   PostgreSQL · Qdrant 를 서비스 컨테이너로 띄워 연동 테스트까지 돌린다 (docker-compose.yml 과 같은 이미지 · 계정)
#   리랭커 토크나이저 계약 테스트는 CI 환경변수가 있으면 skip 하지 않고 실패한다
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # API 계약 검사가 기준 브랜치(origin/<base>)의 manifest 와 비교한다
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Contract
        # 예시 JSON · openapi.json · manifest 가 앱과 맞는지, PR 이면 기준 브랜치 대비 계약 버전을 올렸는지 (README "API 계약")
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            uv run python scripts/build_contract_manifest.py --check --against "origin/$BASE_REF"
          else
            uv run python scripts/build_contract_manifest.py --check
          fi
      - name: Wait for Qdrant
        # 이미지에 curl 이 없어 서비스 헬스체크 대신 러너에서 확인한다
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          exit 1
      - name: Pytest
        run: uv run pytest -rs
